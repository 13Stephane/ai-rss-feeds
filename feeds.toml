[feeds.artificial-analysis]
feed_title = "Artificial Analysis Articles"
feed_description = "Independent analysis of AI models and API providers"
source_url = "https://artificialanalysis.ai/articles"
item_container_selector = "a.group[href^='/articles/']"
item_link_selector = "::attr(href)"
item_title_selector = "h3::text"
item_date_selector = "p.text-muted-foreground::text"

# Posts several times most months but takes long breaks - nothing between
# 2026-08-04 and at least 2026-08-25. The scrape is healthy (95 items, full
# dates), so a limit that rides out a summer lull is the honest signal.
[feeds.aisi-blog]
max_age_days = 35
feed_title = "AISI Blog (AI Security Institute)"
feed_description = "Updates on AISI's work - AI Security Institute"
source_url = "https://www.aisi.gov.uk/blog"
item_container_selector = "div.work-card-wrapper"
item_link_selector = "a[href^='/blog/']::attr(href)"
item_title_selector = "h3::text"
item_date_selector = "p[fs-list-field='date']::text"
item_description_selector = "p[fs-list-field='description']::text"

# Ai2 dates items by month only ("August 2026"), which resolves to the first of
# that month (see AGENTS.md). So the newest pubDate is always the 1st of the
# current month and the measured age climbs past the global 21-day limit on the
# 22nd of every month, whether or not Ai2 has published. 45 days never trips in
# a month they publish in (worst case ~30) but still flags a missed month.
[feeds.allenai-news]
max_age_days = 45
feed_title = "Ai2 News (Allen Institute for AI)"
source_url = "https://allenai.org/news"
item_container_selector = "div[class*='grid-tr_subgrid']"
item_link_selector = "a[href^='/blog/']::attr(href)"
item_title_selector = "h2::text"
item_date_selector = "h2 span:first-child::text"
item_description_selector = "div > p::text"

# Anthropic's two indexes. Both are Next.js pages whose item list arrives in the
# Flight payload, and both broke the same way, a month apart:
#
#   - /news, 2026-09-20: the payload stopped embedding the list (131 KB, zero
#     items, fetched client-side). Parked. It embeds them again as of 2026-10-24
#     (425 KB, 37 articles), so it is unparked.
#   - /research, 2026-10-20 18:05 UTC: the CMS renamed the item type from `post`
#     to `article`. Every run failed "No items matched" from then on.
#
# What the `article` objects look like now, read from both pages on 2026-10-24:
# _id, title, slug.current, publishedOn, articleType ("news" | "research"),
# category, and on two of them linkedUrl. No summary, so these feeds carry no
# descriptions any more.
#
# The two pages now cross-list: /research shows 10 research and 8 news
# articles, /news shows 24 news and 13 research. A link built as <this
# page>/<slug> is therefore wrong for every cross-listed item. Anthropic
# 308-redirects most of them, but a canonical URL that differs between the two
# feeds defeats any reader that de-duplicates by link, and an article with a
# linkedUrl (e.g. "Introducing Claude Mythos and Fable 5.1", which lives at
# /claude-fable-and-mythos-5-1) has no working /research/ or /news/ address at
# all — both 404 or bounce. So the link comes from the article itself:
# linkedUrl when set, otherwise the path its articleType says it lives under.
#
# Each feed mirrors its page. Research keeps articleType "research", which is
# what /research is about. News keeps everything /news lists, research-type
# included: Anthropic leads its news page with research-type pieces now (on
# 2026-10-24 the newest news-type article was from 2026-09-15, the six newer
# items on /news all research-type), so a type filter there would drop what the
# page shows first and leave the feed reading STALE every day. A piece that
# appears in both feeds carries the same canonical link in both, so readers
# that de-duplicate by link see it once.
#
# Both pages list far fewer items than the feeds held (research 182, news 266),
# so the default min_item_ratio_vs_previous (0.6) would reject the first good
# run; and the page size is set by the site from then on. An absolute floor
# replaces it, at roughly half of what each page lists today. Readers keep the
# items they have already fetched, so nothing already delivered is lost.
[feeds.anthropic-news]
feed_title = "Anthropic News"
source_url = "https://www.anthropic.com/news"
format = "nextjs"
item_container_selector = ".. | objects | select(._type == \"article\")"
item_title_selector = ".title"
item_link_selector = ".linkedUrl // (if .slug.current == null then null elif .articleType == \"research\" then \"/research/\" + .slug.current else \"/news/\" + .slug.current end)"
item_date_selector = ".publishedOn // .date"
item_description_selector = ".summary"
min_item_count = 15
min_item_ratio_vs_previous = 0

[feeds.anthropic-research]
feed_title = "Anthropic Research"
source_url = "https://www.anthropic.com/research"
format = "nextjs"
item_container_selector = ".. | objects | select(._type == \"article\" and .articleType == \"research\")"
item_title_selector = ".title"
item_link_selector = ".linkedUrl // (if .slug.current == null then null else \"/research/\" + .slug.current end)"
item_date_selector = ".publishedOn // .date"
item_description_selector = ".summary"
min_item_count = 5
min_item_ratio_vs_previous = 0

# Moved 2026-10-06: claude.com/blog now answers 308 to /resources/articles, and
# every /blog/<slug> redirects to /resources/articles/<same slug>, so links
# already in readers keep working. The new page is a Next.js build whose class
# names carry a build hash (ResourceCard-module-scss-module__q33Tuq__card) that
# changes on redeploy, so nothing here selects on the hash: a card IS its link,
# found by the href prefix; the date span by the stable "__meta" part of its
# class, confirmed by a date regex; title and excerpt by element.
#
# The page shows its six newest articles only (the newest twice — once in a
# featured carousel; the spider keeps one item per link). The old blog feed held
# 20, so the default min_item_ratio_vs_previous (0.6, i.e. 12 of 20) would fail
# the first run, and after that the page size is fixed by the site, not by how
# much was scraped. An absolute floor fits a fixed-size page better: fewer than
# five means a partial scrape.
#
# The old 90-day limit was for a blog that published in rare bursts. The
# articles hub publishes several times a week, so the default limit applies,
# which would have flagged this move within three weeks instead of three months.
[feeds.claude-blog]
feed_title = "Claude Blog"
source_url = "https://claude.com/resources/articles"
item_container_selector = "a[href^='/resources/articles/']"
item_title_selector = "h3::text"
item_link_selector = "a::attr(href)"
item_date_selector = "span[class*='__meta']::text"
item_date_regex = "[A-Z][a-z]{2,8} \\d{1,2}, \\d{4}"
item_description_selector = "p::text"
min_item_count = 5
min_item_ratio_vs_previous = 0

[feeds.mila-news]
feed_title = "Mila News (Quebec AI Institute)"
feed_description = "News and announcements from Mila - Quebec AI Institute."
source_url = "https://mila.quebec/en/news"
item_container_selector = "#news-listing .node--type-news"
item_title_selector = "div.field-name-node-title a::text"
item_link_selector = "div.field-name-node-title a::attr(href)"
item_date_selector = "div.field-name-dynamic-twig-fieldnode-default-date-format-wrapped span::text"

[feeds.mistral-news]
feed_title = "Mistral News"
feed_description = "Latest news and announcements from Mistral AI."
source_url = "https://mistral.ai/news/"
item_container_selector = "article.js-post"
item_title_selector = "h2 ::text"
item_link_selector = "a::attr(href)"
item_date_selector = "footer div:first-child p ::text"
item_description_selector = "h2 + p ::text"


# --- External feeds -----------------------------------------------------
# These publishers already provide RSS, so nothing is scraped or generated for
# them. They exist only to be passed through into feeds.opml, so they land in
# the reader alongside the generated feeds. Set `external_feed_url` (the RSS
# URL) and optionally `site_url` (the human page). No selectors apply.

# Google News searches standing in for Google Alerts. An alert's own RSS URL
# carries a per-account token and the RSS delivery option is unavailable on the
# owner's account, so the alerts cannot be carried directly.
#
# All three use the loose OR form on purpose. Probed from a runner: the alerts'
# own booleans return relevance-ranked archives (newest 3-10 days, tails running
# back 8-11 years), and space-separated phrasings are little better. The OR form
# returns recency-ranked results, which is what makes these read as monitors and
# keeps them clear of the staleness limit.

[feeds.ai-productivity-news]
feed_title = "AI Productivity, Growth and Value (Google News)"
external_feed_url = "https://news.google.com/rss/search?hl=en-US&gl=US&ceid=US:en&q=AI%20productivity%20OR%20growth%20OR%20value"
site_url = "https://news.google.com/search?hl=en-US&gl=US&ceid=US:en&q=AI%20productivity%20OR%20growth%20OR%20value"

# Stands in for the alert `Innovation AND "artificial intelligence" AND Corporate`.
# Measured: median 25 days, 54 of 100 items within 30 days.
[feeds.ai-corporate-innovation]
feed_title = "AI and Corporate Innovation (Google News)"
external_feed_url = "https://news.google.com/rss/search?hl=en-US&gl=US&ceid=US:en&q=AI%20corporate%20innovation%20OR%20enterprise%20innovation%20OR%20business%20innovation"
site_url = "https://news.google.com/search?hl=en-US&gl=US&ceid=US:en&q=AI%20corporate%20innovation%20OR%20enterprise%20innovation%20OR%20business%20innovation"

# Stands in for the alert `"corporate culture" AND "artificial intelligence"`.
# Broader than that alert - it takes in talent and workforce as well as culture -
# because the culture-only phrasings returned mostly months-old material
# (23 of 100 within 30 days). Measured here: median 4 days, 76 of 100 within 30.
[feeds.ai-culture-workforce]
feed_title = "AI, Culture and Workforce (Google News)"
external_feed_url = "https://news.google.com/rss/search?hl=en-US&gl=US&ceid=US:en&q=AI%20culture%20OR%20talent%20OR%20workforce"
site_url = "https://news.google.com/search?hl=en-US&gl=US&ceid=US:en&q=AI%20culture%20OR%20talent%20OR%20workforce"

# Anthropic publishes no feed of its own - probed 2026-09-25: rss.xml, /feed,
# /feed.xml, /rss, /atom.xml, /news/rss.xml, /news/feed, /index.xml all 404, no
# alternate link tags, and /news stopped embedding its posts (see anthropic-news,
# parked). So this stands in, the same way the Google News feeds stand in for the
# Google Alerts.
#
# Measured across four phrasings from a runner: `site:anthropic.com/news` is
# exactly the right scope but relevance-ranked and useless as a monitor (median
# 241 days old, 8 of 100 items within 30 days). This loose phrasing is
# recency-ranked instead - median 1 day, 101 of 102 items within 30 days, 91 of
# 102 naming Anthropic.
#
# Note what this is: coverage OF Anthropic, which includes their own posts but
# also third-party reporting. It is not a first-party feed, and the title says so.
[feeds.anthropic-google-news]
feed_title = "Anthropic News and Coverage (Google News)"
external_feed_url = "https://news.google.com/rss/search?hl=en-US&gl=US&ceid=US:en&q=Anthropic%20Claude"
site_url = "https://news.google.com/search?hl=en-US&gl=US&ceid=US:en&q=Anthropic%20Claude"

# HBR's only feed, and the one HBR itself links to from its homepage, from
# /the-latest and from the AI topic page. It replaces the hbr-ai scrape, which
# died when HBR rebuilt that topic page: the replacement carries no dates at all,
# and the pre-rebuild template that was briefly still served under any
# unrecognised suffix of the topic path stopped answering on 2026-09-16.
#
# Three things to know about it:
#   - Whole-site, not AI-scoped. There is no topic feed: /technology,
#     /innovation and /hbr all 404, and hbr.org has no feeds index page. It is
#     AI-dense even so - 34 of 100 entry titles named AI, ML, agents or LLMs
#     when measured on 2026-09-25.
#   - Plain HTTP. HBR advertises the https:// form, but https fails the TLS
#     handshake from GitHub's runners on both feeds.harvardbusiness.org and
#     feeds.hbr.org (SSL_ERROR_SYSCALL), reproduced on three separate days. Only
#     http answers, so that is what is configured; the feed carries no
#     credentials, so the exposure is that a network observer sees which public
#     feed was fetched.
#   - Atom 1.0, not RSS 2.0, which is why check_feeds.py learned Atom.
#
# If HBR ever restores dates to the AI topic page, an AI-scoped scrape becomes
# possible again and would be the better feed.
[feeds.hbr]
feed_title = "Harvard Business Review"
external_feed_url = "http://feeds.harvardbusiness.org/harvardbusiness/"
site_url = "https://hbr.org/"

[feeds.techcrunch]
feed_title = "TechCrunch"
external_feed_url = "https://techcrunch.com/feed/"
site_url = "https://techcrunch.com/"

# Substack answers 403 to GitHub's runner IPs — a browser User-Agent does not
# change it — while serving the feed normally to subscribers. Flaky so the
# health check reports that without failing the run on a feed that is fine.
[feeds.import-ai]
flaky = true
feed_title = "Import AI (Jack Clark)"
external_feed_url = "https://importai.substack.com/feed"
site_url = "https://importai.substack.com/"

[feeds.rundown-ai]
feed_title = "The Rundown AI"
external_feed_url = "https://rss.beehiiv.com/feeds/2R3C6Bt5wj.xml"
site_url = "https://www.therundown.ai/"

# Substack, so flaky for the same reason as import-ai: confirmed HTTP 403 from
# a GitHub runner while the feed serves subscribers normally.
[feeds.deep-phenotype]
flaky = true
feed_title = "Deep Phenotype"
external_feed_url = "https://deepphenotype.substack.com/feed"
site_url = "https://deepphenotype.substack.com/"

# Substack again: confirmed HTTP 403 from a GitHub runner, so the same
# runner-IP block as import-ai and deep-phenotype rather than a bad URL.
[feeds.clouded-judgement]
flaky = true
feed_title = "Clouded Judgement"
external_feed_url = "https://cloudedjudgement.substack.com/feed"
site_url = "https://cloudedjudgement.substack.com/"
