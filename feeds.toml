[feeds.artificial-analysis]
feed_title = "Artificial Analysis Articles"
feed_description = "Independent analysis of AI models and API providers"
source_url = "https://artificialanalysis.ai/articles"
item_container_selector = "a.group[href^='/articles/']"
item_link_selector = "::attr(href)"
item_title_selector = "h3::text"
item_date_selector = "p.text-muted-foreground::text"

# Posts several times most months but takes long breaks - nothing between
# 2026-08-04 and at least 2026-08-25. The scrape is healthy (95 items, full
# dates), so a limit that rides out a summer lull is the honest signal.
[feeds.aisi-blog]
max_age_days = 35
feed_title = "AISI Blog (AI Security Institute)"
feed_description = "Updates on AISI's work - AI Security Institute"
source_url = "https://www.aisi.gov.uk/blog"
item_container_selector = "div.work-card-wrapper"
item_link_selector = "a[href^='/blog/']::attr(href)"
item_title_selector = "h3::text"
item_date_selector = "p[fs-list-field='date']::text"
item_description_selector = "p[fs-list-field='description']::text"

# Ai2 dates items by month only ("August 2026"), which resolves to the first of
# that month (see AGENTS.md). So the newest pubDate is always the 1st of the
# current month and the measured age climbs past the global 21-day limit on the
# 22nd of every month, whether or not Ai2 has published. 45 days never trips in
# a month they publish in (worst case ~30) but still flags a missed month.
[feeds.allenai-news]
max_age_days = 45
feed_title = "Ai2 News (Allen Institute for AI)"
source_url = "https://allenai.org/news"
item_container_selector = "div[class*='grid-tr_subgrid']"
item_link_selector = "a[href^='/blog/']::attr(href)"
item_title_selector = "h2::text"
item_date_selector = "h2 span:first-child::text"
item_description_selector = "div > p::text"

[feeds.anthropic-news]
feed_title = "Anthropic News"
source_url = "https://www.anthropic.com/news"
