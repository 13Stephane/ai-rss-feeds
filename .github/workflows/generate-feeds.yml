# TEMPORARY: this branch swaps the generator for an hbr.org page probe so
# it can be dispatched; restored in the following commit.
name: Generate RSS feeds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the topic page as the scraper would
        env:
          UA: "ai-rss-feeds-bot/1.0 (+https://github.com/alan-turing-institute/ai-rss-feeds)"
          URL: "https://hbr.org/topic/subject/ai-and-machine-learning"
        run: |
          curl -sS -A "$UA" -D headers.txt -o page.html -L --max-time 60 "$URL" || true

          echo "=== STATUS ==="
          head -1 headers.txt
          grep -i -E "^(content-type|x-robots-tag|server)" headers.txt | head -5
          wc -c page.html

          echo "=== DECLARED FEEDS ==="
          grep -o -i '<link[^>]*application/[a-z]*+xml[^>]*>' page.html | head -10

          echo "=== ARTICLE LINK PATTERNS ==="
          grep -o -E 'href="/[0-9]{4}/[0-9]{2}/[^"]+"' page.html | sort -u | head -10

          echo "=== MARKUP AROUND FIRST ARTICLE LINK ==="
          tr '>' '>\n' < page.html > tags.txt
          line=$(grep -n -m1 -E 'href="/[0-9]{4}/[0-9]{2}/' tags.txt | cut -d: -f1)
          if [ -n "$line" ]; then
            start=$((line > 40 ? line - 40 : 1))
            sed -n "${start},$((line + 40))p" tags.txt
          else
            echo "(no dated article link found; first 80 tags follow)"
            head -80 tags.txt
          fi
