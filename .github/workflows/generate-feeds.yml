# TEMPORARY: this branch swaps the generator for an hbr.org probe so it can be
# dispatched; restored in the following commit.
name: Generate RSS feeds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Generate only the HBR feed
        run: |
          uv run python generate_feeds.py hbr-ai --no-cache 2>&1 | tail -25

      - name: Show what came out
        run: |
          echo "=== ITEM COUNT ==="
          grep -c "<item>" feeds/hbr-ai.xml
          echo "=== ALL ITEMS (date | title | host) ==="
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from urllib.parse import urlparse
          ch = ET.parse("feeds/hbr-ai.xml").getroot().find("channel")
          for item in ch.findall("item"):
              date = (item.findtext("pubDate") or "")[:16]
              title = (item.findtext("title") or "")[:70]
              host = urlparse(item.findtext("link") or "").netloc
              print(f"{date} | {title} | {host}")
          PY
