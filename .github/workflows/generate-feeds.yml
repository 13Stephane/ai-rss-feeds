# TEMPORARY: this branch swaps the generator for an hbr.org page probe so
# it can be dispatched; restored in the following commit.
name: Generate RSS feeds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Print one complete stream entry
        env:
          UA: "ai-rss-feeds-bot/1.0 (+https://github.com/alan-turing-institute/ai-rss-feeds)"
          URL: "https://hbr.org/topic/subject/ai-and-machine-learning"
        run: |
          curl -sS -A "$UA" -o page.html -L --max-time 60 "$URL"
          tr '<' '\n<' < page.html > tags.txt

          echo "=== ENTRY 3 (skipping the two magazine teasers) ==="
          awk '/<li class="stream-entry"/{n++} n==3' tags.txt | head -70

          echo "=== DEK / SUMMARY MARKUP PRESENT? ==="
          grep -o -E 'class="[^"]*(dek|summary|description)[^"]*"' tags.txt | sort | uniq -c | head
