# TEMPORARY: this branch swaps the generator for an hbr.org page probe so
# it can be dispatched; restored in the following commit.
name: Generate RSS feeds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect the topic page's item markup
        env:
          UA: "ai-rss-feeds-bot/1.0 (+https://github.com/alan-turing-institute/ai-rss-feeds)"
          URL: "https://hbr.org/topic/subject/ai-and-machine-learning"
        run: |
          curl -sS -A "$UA" -o page.html -L --max-time 60 "$URL"

          echo "=== ITEM COUNT ==="
          grep -c '<stream-item' page.html
          grep -c 'class="stream-entry"' page.html

          echo "=== CONTENT TYPES ==="
          grep -o 'data-content-type="[^"]*"' page.html | sort | uniq -c

          echo "=== ANY DATE MARKUP? ==="
          grep -o -i -E '<time[^>]*>|datetime="[^"]*"|data-[a-z-]*date[a-z-]*="[^"]*"|class="[^"]*date[^"]*"' page.html | sort | uniq -c | head -20

          echo "=== ITEM OPENING TAGS (all data attrs, first 4 items) ==="
          tr '>' '>\n' < page.html | grep -A0 -E 'data-url="/[0-9]{4}/[0-9]{2}/' | head -4

          echo "=== stream-item-info BLOCKS (first 3) ==="
          tr '<' '\n<' < page.html | grep -A12 'div class="stream-item-info"' | head -60
